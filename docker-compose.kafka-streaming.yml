# =============================================================================
# Instancia EC2 #4 — Microservicio Independiente de Kafka Streaming
# Uso: docker compose -f docker-compose.kafka-streaming.yml up -d --build
# Requiere definir KAFKA_BOOTSTRAP_SERVERS apuntando a la Instancia EC2 #3
# (por ejemplo en archivo .env: KAFKA_BOOTSTRAP_SERVERS=<IP_EC2_KAFKA>:9092,<IP_EC2_KAFKA>:9093,<IP_EC2_KAFKA>:9094)
# =============================================================================

services:
  kafka-streaming-service:
    build: ./kafka-streaming
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092,localhost:9093,localhost:9094}
      KAFKA_REPLICAS: ${KAFKA_REPLICAS:-3}
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    volumes:
      - streams_state:/tmp/kafka-streams
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  streams_state:
