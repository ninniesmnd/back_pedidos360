server.port=8080
spring.application.name=pedidos-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

# --- Base de datos local (Postgres via Docker) ---
# Cuando pases a RDS para EP2, solo cambia estas 3 lineas.
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Conexión RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# --- Topología centralizada (pedidos) ---
app.rabbitmq.pedidos.exchange=pedidos.exchange
app.rabbitmq.pedidos.dlx=pedidos.dlx

app.rabbitmq.pedidos.notificaciones.queue=pedidos.notificaciones.queue
app.rabbitmq.pedidos.notificaciones.dlq=pedidos.notificaciones.queue.dlq
app.rabbitmq.pedidos.notificaciones.binding-key=pedido.#

app.rabbitmq.pedidos.ticket-cocina.queue=pedidos.ticket-cocina.queue
app.rabbitmq.pedidos.ticket-cocina.dlq=pedidos.ticket-cocina.queue.dlq
app.rabbitmq.pedidos.ticket-cocina.binding-key=pedido.creado