server.port=8080
spring.application.name=pedidos-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

# --- Base de datos local (Postgres via Docker) ---
# Cuando pases a RDS para EP2, solo cambia estas 3 lineas.
spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos360
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Comunicacion con rabbit-admin ---
app.rabbit-admin.url=${RABBIT_ADMIN_URL:http://localhost:8082}
app.internal.api-key=${INTERNAL_API_KEY:dev-internal-key}

# Si es true, un listener consume las DLQ y las registra (las saca de la cola).
# Dejalo en false para poder ver los mensajes en la DLQ durante la demo.
app.dlq-logger.enabled=false

# --- Kafka (productor y consumidor de salida de streaming) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.client-id=pedidos-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Si Kafka cae, no colgar la peticion HTTP: el pedido ya esta guardado
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

app.kafka.topic=negocio.eventos
app.kafka.salida=analitica.salida
app.kafka.group-reaccion=pedidos-reaccion-group
