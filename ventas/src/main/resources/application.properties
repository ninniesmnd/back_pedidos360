server.port=8081
spring.application.name=ventas-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

# --- Base de datos local (Postgres via Docker) ---
# Ojo: puerto 5433, no 5432, para no chocar con la BD de pedidos-service si corren en el mismo host.
spring.datasource.url=jdbc:postgresql://localhost:5433/ventas360
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

app.rabbitmq.ventas.exchange=ventas.exchange
app.rabbitmq.ventas.dlx=ventas.dlx

app.rabbitmq.ventas.alertas-stock.queue=ventas.alertas-stock.queue
app.rabbitmq.ventas.alertas-stock.dlq=ventas.alertas-stock.queue.dlq
app.rabbitmq.ventas.alertas-stock.binding-key=stock.bajo

app.rabbitmq.ventas.comprobantes.queue=ventas.comprobantes.queue
app.rabbitmq.ventas.comprobantes.dlq=ventas.comprobantes.queue.dlq
app.rabbitmq.ventas.comprobantes.binding-key=venta.registrada