server.port=8081
spring.application.name=ventas-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

# --- Base de datos local (Postgres via Docker) ---
# Ojo: puerto 5433, no 5432, para no chocar con la BD de pedidos-service si corren en el mismo host.
spring.datasource.url=jdbc:postgresql://localhost:5433/ventas360
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true
app.internal.api-key=${INTERNAL_API_KEY:dev-internal-key}

spring.sql.init.mode=always


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.rabbit-admin.url=${RABBIT_ADMIN_URL:http://localhost:8082}

app.inventario.umbral-stock-bajo=5

# --- Kafka (productor) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.client-id=ventas-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Si Kafka cae, no colgar la peticion HTTP: la venta ya esta guardada
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
app.kafka.topic=negocio.eventos

