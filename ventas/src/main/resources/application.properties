server.port=8081
spring.application.name=ventas-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

# --- Base de datos local (Postgres via Docker) ---
# Ojo: puerto 5433, no 5432, para no chocar con la BD de pedidos-service si corren en el mismo host.
spring.datasource.url=jdbc:postgresql://localhost:5433/ventas360
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

app.rabbitmq.exchanges.ventas=ventas.exchange
app.rabbitmq.exchanges.dlx=ventas.dlx

app.rabbitmq.queues.alertas-stock=ventas.alertas-stock.queue
app.rabbitmq.queues.comprobantes=ventas.comprobantes.queue

app.rabbitmq.dlq.alertas-stock=ventas.alertas-stock.queue.dlq
app.rabbitmq.dlq.comprobantes=ventas.comprobantes.queue.dlq

app.rabbitmq.routing-keys.stock-bajo=stock.bajo
app.rabbitmq.routing-keys.venta-registrada=venta.registrada

app.rabbitmq.retry.max-intentos=3
app.rabbitmq.retry.backoff-ms=2000

app.inventario.umbral-stock-bajo=5

app.dlq-logger.enabled=false