server.port=8082
spring.application.name=rabbit-admin-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0

management.endpoints.web.exposure.include=health

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
app.internal.api-key=${INTERNAL_API_KEY:dev-internal-key}
# Topología del sistema: no se puede crear/borrar/bindear desde la API
app.rabbit-admin.protegidos=pedidos.exchange,pedidos.dlx,pedidos.notificaciones.queue,pedidos.notificaciones.queue.dlq,pedidos.ticket-cocina.queue,pedidos.ticket-cocina.queue.dlq,ventas.exchange,ventas.dlx,ventas.alertas-stock.queue,ventas.alertas-stock.queue.dlq,ventas.comprobantes.queue,ventas.comprobantes.queue.dlq
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# --- Topologia: pedidos ---
app.rabbitmq.exchanges.pedidos=pedidos.exchange
app.rabbitmq.exchanges.pedidos-dlx=pedidos.dlx
app.rabbitmq.queues.notificaciones=pedidos.notificaciones.queue
app.rabbitmq.queues.ticket-cocina=pedidos.ticket-cocina.queue
app.rabbitmq.dlq.notificaciones=pedidos.notificaciones.queue.dlq
app.rabbitmq.dlq.ticket-cocina=pedidos.ticket-cocina.queue.dlq
app.rabbitmq.routing-keys.binding-notificaciones=pedido.#
app.rabbitmq.routing-keys.binding-ticket-cocina=pedido.creado
app.rabbitmq.routing-keys.pedido-creado=pedido.creado
app.rabbitmq.routing-keys.pedido-estado-cambiado=pedido.estado.cambiado

# --- Topologia: ventas ---
app.rabbitmq.exchanges.ventas=ventas.exchange
app.rabbitmq.exchanges.ventas-dlx=ventas.dlx
app.rabbitmq.queues.alertas-stock=ventas.alertas-stock.queue
app.rabbitmq.queues.comprobantes=ventas.comprobantes.queue
app.rabbitmq.dlq.alertas-stock=ventas.alertas-stock.queue.dlq
app.rabbitmq.dlq.comprobantes=ventas.comprobantes.queue.dlq
app.rabbitmq.routing-keys.stock-bajo=stock.bajo
app.rabbitmq.routing-keys.venta-registrada=venta.registrada

app.rabbitmq.retry.max-intentos=3
app.rabbitmq.retry.backoff-ms=2000
app.dlq-logger.enabled=false