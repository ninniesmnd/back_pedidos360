server.port=8083
spring.application.name=kafka-admin-service

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/1b185538-3c99-4453-8c77-b86e78fa3157/v2.0
management.endpoints.web.exposure.include=health

# --- Cliente Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=kafka-admin-service
# Si el broker no esta listo, el contenedor falla y se reinicia (restart: unless-stopped)
spring.kafka.admin.fail-fast=true
# Reaplica retencion/cleanup declarados en KafkaTopicConfig a topicos existentes
spring.kafka.admin.modify-topic-configs=true

# Consumidores: String crudo, se parsea y valida en KafkaEventParser
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# Productor (solo lo usa el recoverer para enviar a la DLT): Strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# --- Topologia ---
app.kafka.replicas=${KAFKA_REPLICAS:3}
app.kafka.pedidos.name=pedidos.eventos
app.kafka.pedidos.partitions=3
app.kafka.pedidos.retention-ms=604800000
app.kafka.pedidos.cleanup-policy=delete
app.kafka.ventas.name=ventas.eventos
app.kafka.ventas.partitions=3
app.kafka.ventas.retention-ms=2592000000
app.kafka.ventas.cleanup-policy=delete
app.kafka.dlt.partitions=1
app.kafka.dlt.retention-ms=1209600000
app.kafka.retry.backoff-ms=1000
app.kafka.retry.max-reintentos=2

# --- Consumer groups ---
app.kafka.groups.auditoria=auditoria-group
app.kafka.groups.analitica=analitica-group
app.kafka.groups.ventas-notificaciones=ventas-notificaciones-group