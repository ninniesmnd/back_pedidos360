server.port=8084
spring.application.name=kafka-streaming-service
management.endpoints.web.exposure.include=health

app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.application-id=pedidos360-streaming
app.kafka.entrada=negocio.eventos
app.kafka.salida=analitica.salida
app.kafka.replicas=${KAFKA_REPLICAS:3}
app.kafka.threads=3
app.kafka.ventana-segundos=60
app.kafka.commit-interval-ms=5000
